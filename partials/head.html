<!-- Statistik: Umami (cookiefrei). [UMAMI-ID] durch die Website-ID aus Umami ersetzen.
     Bei eigenem Umami-Server die Adresse in src anpassen. data-domains verhindert Zählung bei lokaler Vorschau. -->
<script defer src="https://cloud.umami.is/script.js" data-website-id="[UMAMI-ID]" data-domains="[DOMAIN]"></script>

<link rel="icon" href="/assets/icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
